    <script>
      // Ensure window.fetch has both getter & setter to prevent "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var nativeFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          var _currentFetch = nativeFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            }
          });
        } catch (e) {
          // Ignore if already configured
        }
      })();
    </script>
