<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
      .title-the-b {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 42px;
        font-weight: 700;
        fill: #0B0B0B;
      }
      .title-main-b {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 88px;
        font-weight: 900;
        letter-spacing: -0.02em;
        fill: #0B0B0B;
      }
      .tagline-b {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.28em;
        fill: #0B0B0B;
      }
    </style>
  </defs>

  <!-- Left Monochrome Black Emblem -->
  <g transform="translate(30, 26) scale(0.95)">
    <!-- Top-Left Arched Tile -->
    <path d="M 20,95 L 20,72 C 20,32 38,18 95,18 L 95,95 Z" fill="#0B0B0B" />
    <!-- Top-Right Leaf -->
    <path d="M 105,95 C 105,48 138,20 180,18 C 180,64 152,95 105,95 Z" fill="#0B0B0B" />
    <!-- Bottom-Left Tile -->
    <rect x="20" y="105" width="75" height="75" rx="14" fill="#0B0B0B" />
    <!-- Bottom-Right Arched Tile -->
    <path d="M 105,105 L 180,105 C 180,152 148,180 105,180 Z" fill="#0B0B0B" />
  </g>

  <!-- Wordmark in Deep Black -->
  <g transform="translate(240, 20)">
    <text x="0" y="48" class="title-the-b">The</text>
    <text x="0" y="132" class="title-main-b">Founder Grid</text>
    <text x="4" y="184" class="tagline-b">WHERE BUSINESS MEETS OPPORTUNITY</text>
  </g>
</svg>
